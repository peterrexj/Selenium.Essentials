name: .NET

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout main repository
      uses: actions/checkout@v3

    - name: Clone Pj Library
      run: |
        git clone https://${{ secrets.INTERNAL_PAT_TOKEN }}@github.com/peterrexj/PjLibrary.git temp/PjLibrary

    - name: Move dependent repo [PjLibrary] to Selenium Essentials
      run: |
        mv temp/PjLibrary /home/runner/work/Selenium.Essentials/PjLibrary
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 6.0.x
    - name: Restore dependencies
      run: dotnet restore src/Selenium.Essentials/Selenium.Essentials.sln
    - name: Build 
      run: dotnet build src/Selenium.Essentials/Selenium.Essentials.sln --no-restore
    - name: Test
      run: dotnet test test/Selenium.Essentials.UnitTests/Selenium.Essentials.UnitTests.csproj --no-build --verbosity normal
